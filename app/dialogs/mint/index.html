<div class="col gap16 back-gray100 p32 relative">
    <img class="img20 cursor absolute top right m16" src="/icon/close.svg"
         ng-click="close()">
    <div class="row acc">
        <span class="text-white bold text2">Mint</span>
    </div>

    <div class="row gap16 back-gray100">
        <div class="col back-gray200 r8 p8"
             ng-click="upload()">
            <img src="/img/nft.jpg" class="img160 r8">
        </div>

        <div class="col gap16">
            <div class="col gap8">
                <span class="text-gray text-14">Заголовок</span>
                <input type="text" ng-model="mem_title" placeholder="Заголовок"
                       class="flex back-gray100 border-gray r4 p8 text-white pl32">
            </div>

            <div class="col gap8">
                <span class="text-gray text-14">Цена</span>
                <input type="number" ng-model="mem_price" placeholder="Цена"
                       class="flex back-gray100 border-gray r4 p8 text-white pl32">
            </div>

            <button ng-click="save()"
                    class="flex back-gray100 border-gray r4 p8 text-white">
                Сохранить
            </button>
        </div>
    </div>
</div>
