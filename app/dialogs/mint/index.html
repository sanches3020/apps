<div class="dialog col gap16 back-gray100 p32 relative">
    <img class="img20 cursor absolute top right m16" src="/icon/close.svg" ng-click="close()">

    <div class="row acc">
        <span class="text-white bold text2">Mint</span>
    </div>


    <label for="fileInput" class="file-label text-white back-gray200 r8 p8 cursor">
        Выбрать файл
    </label>
    <input id="fileInput" type="file" class="hidden"
           onchange="angular.element(this).scope().upload(this.files[0])">

    <img ng-if="mem_image" ng-src="{{ mem_image }}" class="img160 r8 mt8">

    <div class="col gap8">
        <span class="text-gray text-14">Заголовок</span>
        <input type="text" ng-model="mem_title" placeholder="Заголовок"
               class="flex back-gray100 border-gray r4 p8 text-white pl32">
    </div>

    <div class="col gap8">
        <span class="text-gray text-14">Цена</span>
        <input type="number" ng-model="mem_price" placeholder="Цена"
               class="flex back-gray100 border-gray r4 p8 text-white pl32">
    </div>

    <button ng-click="save()" class="flex back-gray100 border-gray r4 p8 text-white">
        Сохранить
    </button>

    <small class="text-center text-gray mt8">
        Protected by ⚙️ <span class="text-white">privacy</span>
    </small>
</div>
